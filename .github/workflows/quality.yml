name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev environment
        run: make dev-install

      - name: Validate pre-commit config
        run: ./.venv/bin/python3.11 -m pre_commit validate-config

      - name: Run pre-commit on changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            base_commit="$(git merge-base HEAD FETCH_HEAD)"
            ./.venv/bin/python3.11 -m pre_commit run \
              --from-ref "${base_commit}" \
              --to-ref HEAD \
              --show-diff-on-failure
            exit 0
          fi
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            ./.venv/bin/python3.11 -m pre_commit run \
              --from-ref "${BEFORE_SHA}" \
              --to-ref HEAD \
              --show-diff-on-failure
            exit 0
          fi
          files=(
            .pre-commit-config.yaml
            .github/workflows/quality.yml
            CONTRIBUTING.md
            docs/getting-started.md
            Makefile
            scripts/baselines/*.tsv
            scripts/validate_quality_patterns.py
            scripts/validate_commit_message.py
          )
          ./.venv/bin/python3.11 -m pre_commit run \
            --files "${files[@]}" \
            --show-diff-on-failure

      - name: Validate pushed commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            commits="$(git rev-list --reverse "${PR_BASE_SHA}..${PR_HEAD_SHA}")"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            commits="$(git rev-list --reverse "${BEFORE_SHA}..HEAD")"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            commits="$(git rev-list --reverse "origin/${DEFAULT_BRANCH}..HEAD")"
          else
            commits="$(git rev-parse HEAD)"
          fi
          while IFS= read -r commit; do
            [[ -n "${commit}" ]] || continue
            subject="$(git log -1 --format=%s "${commit}")"
            echo "Checking ${commit}: ${subject}"
            ./.venv/bin/python3.11 scripts/validate_commit_message.py --subject "${subject}"
          done <<< "${commits}"

      - name: Run package check
        run: make check

      - name: Run release smoke
        run: make release-check
